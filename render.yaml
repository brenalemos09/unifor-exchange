# Publicação no Render (Blueprint): API + site.
# No painel do Render: New > Blueprint > escolher este repositório.
# Os valores marcados com sync: false são preenchidos no painel (nunca no GitHub).
services:
  - type: web
    name: unifor-exchange-api
    runtime: node
    rootDir: api
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /saude
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_HOST
        sync: false
      - key: DATABASE_PORT
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DATABASE_NAME
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGEM
        sync: false
      - key: RECUPERACAO_DEMO
        value: "false"

  # Site (front-end) como site estático
  - type: web
    name: unifor-exchange
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # endereço da API publicada, lido no build
      - key: VITE_API_URL
        sync: false
